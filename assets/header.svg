    <rect width="1280" height="360" fill="url(#grid)"/>
    <ellipse cx="1110" cy="170" rx="400" ry="300" fill="url(#glow)"/>
    <path d="M640 360L900 0M710 360L970 0" stroke="#8B79FA" stroke-opacity=".1"/>
    <path d="M47 24H1233" stroke="url(#accent)" stroke-width="2"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="64" y="78" fill="#67DDE8" font-size="14" font-weight="600" letter-spacing="3">ROSTYSLAV / PYTHON · AI · AUTOMATION</text>
      <text x="60" y="174" fill="#F2F5FC" font-size="92" font-weight="800" letter-spacing="-3">KLON4IK<tspan fill="#9A8AFF">.</tspan></text>
      <text x="64" y="219" fill="#B7C4D9" font-size="24">Python, AI &amp; practical automation</text>
      <g transform="translate(64 258)" font-size="12" font-weight="600" letter-spacing="1.5">
        <rect width="84" height="31" rx="7" fill="#153342" stroke="#315361"/><text x="42" y="20" fill="#6BE3E7" text-anchor="middle">CODE</text>
        <rect x="96" width="128" height="31" rx="7" fill="#24213F" stroke="#494065"/><text x="160" y="20" fill="#BBA6FF" text-anchor="middle">AUTOMATE</text>
        <rect x="236" width="118" height="31" rx="7" fill="#192C35" stroke="#38515E"/><text x="295" y="20" fill="#A7C6DB" text-anchor="middle">IMPROVE</text>
      </g>
      <g transform="translate(768 68)">
        <rect width="448" height="230" rx="14" fill="#0B1220" stroke="#33405E"/>
        <path d="M0 43H448" stroke="#27334C"/>
        <circle cx="22" cy="22" r="4" fill="#8B79FA"/><circle cx="38" cy="22" r="4" fill="#5DD9E3"/><circle cx="54" cy="22" r="4" fill="#4A5973"/>
        <text x="78" y="27" fill="#8294B4" font-size="13">profile.py</text>
        <g font-family="Cascadia Code, Consolas, monospace" font-size="16">
          <text x="24" y="79" fill="#B2BFD4">profile = {</text>
          <text x="44" y="111" fill="#A7B7D1"><tspan fill="#A897FF">&quot;name&quot;</tspan>: <tspan fill="#64DCC5">&quot;Rostyslav&quot;</tspan>,</text>
          <text x="44" y="143" fill="#A7B7D1"><tspan fill="#A897FF">&quot;stack&quot;</tspan>: [<tspan fill="#64DCC5">&quot;Python&quot;</tspan>, <tspan fill="#64DCC5">&quot;AI&quot;</tspan>],</text>
          <text x="44" y="175" fill="#A7B7D1"><tspan fill="#A897FF">&quot;focus&quot;</tspan>: <tspan fill="#64DCC5">&quot;Automation&quot;</tspan></text>
          <text x="24" y="207" fill="#B2BFD4">}<tspan dx="12" fill="#647896"># build something useful</tspan></text>
        </g>
      </g>
      <text x="1214" y="335" fill="#677995" font-size="11" text-anchor="end" letter-spacing="2">BUILD / LEARN / REPEAT</text>
