<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Klon4ik — Rostyslav</title>
  <desc id="desc">A dark technology banner for Rostyslav's GitHub profile. Python, artificial intelligence and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#111B30"/><stop offset=".58" stop-color="#0D1323"/><stop offset="1" stop-color="#17112D"/></linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="1232" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#53E1E8"/><stop offset=".5" stop-color="#8B79FA"/><stop offset="1" stop-color="#BC78EC"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7755D9" stop-opacity=".2"/><stop offset="1" stop-color="#7755D9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#546A90" stroke-opacity=".1"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1278" height="358" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
